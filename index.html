
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Store | Login</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <main class="auth-page">
        <section class="auth-card">
            <div class="brand">
                <div class="brand-logo"><i class="fa-solid fa-store"></i></div>
                <h1>My Store</h1>
                <p>Your shopping experience starts here.</p>
            </div>

            <div id="loginBox">
                <div class="form-heading">
                    <h2>Welcome Back!</h2>
                    <p>Log in to your account.</p>
                </div>

                <form id="loginForm">
                    <label for="username">Email or Username</label>
                    <div class="input-wrap">
                        <i class="fa-regular fa-user"></i>
                        <input type="text" id="username" placeholder="Enter email or username" required>
                    </div>
                    <small id="userError" class="error-message"></small>

                    <label for="password">Password</label>
                    <div class="input-wrap">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="password" placeholder="Enter password" required>
                        <button type="button" id="togglePassword" class="password-toggle" aria-label="Show password">
                            <i class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                    <small id="passError" class="error-message"></small>

                    <label for="accountRole">Login as</label>
                    <div class="input-wrap">
                        <i class="fa-solid fa-user-tag"></i>
                        <select id="accountRole" required>
                            <option value="customer">Customer</option>
                            <option value="seller">Seller</option>
                        </select>
                    </div>

                    <div class="form-options">
                        <label class="remember-option">
                            <input type="checkbox" id="rememberMe">
                            Remember me
                        </label>
                        <button type="button" id="forgotPassword" class="link-button">Forgot password?</button>
                    </div>

                    <button type="submit" class="submit-btn">Log In <i class="fa-solid fa-arrow-right"></i></button>
                    <p id="loginMessage" class="form-message" aria-live="polite"></p>
                </form>

                <p class="switch-form">Don't have an account? <button type="button" id="showSignup">Sign Up</button></p>
            </div>

            <div id="signupBox" hidden>
                <div class="form-heading">
                    <h2>Create Account</h2>
                    <p>Choose your account type to get started.</p>
                </div>

                <form id="signupForm">
                    <label for="newName">Full Name</label>
                    <div class="input-wrap">
                        <i class="fa-regular fa-user"></i>
                        <input type="text" id="newName" placeholder="Enter your full name" required>
                    </div>

                    <label for="newUsername">Username</label>
                    <div class="input-wrap">
                        <i class="fa-solid fa-at"></i>
                        <input type="text" id="newUsername" placeholder="Choose a username" minlength="3" required>
                    </div>

                    <label for="newEmail">Email Address</label>
                    <div class="input-wrap">
                        <i class="fa-regular fa-envelope"></i>
                        <input type="email" id="newEmail" placeholder="Enter your email" required>
                    </div>

                    <label for="newPassword">Password</label>
                    <div class="input-wrap">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="newPassword" placeholder="Create a password" minlength="6" required>
                        <button type="button" id="toggleNewPassword" class="password-toggle" aria-label="Show password">
                            <i class="fa-regular fa-eye"></i>
                        </button>
                    </div>

                    <label for="confirmPassword">Confirm Password</label>
                    <div class="input-wrap">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="confirmPassword" placeholder="Confirm your password" required>
                    </div>

                    <label>Choose Account Type</label>
                    <div class="role-options">
                        <label class="role-option">
                            <input type="radio" name="signupRole" value="customer" checked>
                            <i class="fa-solid fa-bag-shopping"></i>
                            <span>Customer</span>
                            <small>Shop products</small>
                        </label>
                        <label class="role-option">
                            <input type="radio" name="signupRole" value="seller">
                            <i class="fa-solid fa-store"></i>
                            <span>Seller</span>
                            <small>Manage your store</small>
                        </label>
                    </div>

                    <button type="submit" class="submit-btn">Create Account <i class="fa-solid fa-arrow-right"></i></button>
                    <p id="signupMessage" class="form-message" aria-live="polite"></p>
                </form>

                <p class="switch-form">Already have an account? <button type="button" id="showLogin">Log In</button></p>
            </div>

            <p class="auth-footer">© 2026 My Store. All rights reserved.</p>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
