
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Store - Login</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    <div class="auth-container">
        <div class="auth-card" id="loginBox">
            <div class="store-icon">
                <i class="fas fa-store"></i>
            </div>

            <h1>Login</h1>
            <p class="subtitle">Welcome back to My Store!</p>

            <form id="loginForm">
                <label for="username">Username or Email</label>
                <input type="text" id="username" placeholder="Enter username or email" autocomplete="username" required>
                <span class="error" id="userError"></span>

                <label for="password">Password</label>
                <div class="password-wrapper">
                    <input type="password" id="password" placeholder="Enter password" autocomplete="current-password" required>
                    <button type="button" id="togglePassword">Show</button>
                </div>
                <span class="error" id="passError"></span>

                <label for="accountRole">Account Type</label>
                <select id="accountRole" required>
                    <option value="customer">Customer</option>
                    <option value="seller">Seller</option>
                </select>

                <div class="demo-accounts">
                    <strong>Demo Accounts</strong>
                    <p>Customer: user@example.com / user123</p>
                    <p>Seller: seller@example.com / seller123</p>
                </div>

                <div class="remember-row">
                    <label class="remember-label">
                        <input type="checkbox" id="rememberMe">
                        <span>Remember Me</span>
                    </label>
                </div>

                <a href="#" id="forgotPassword" class="forgot-link">Forgot Password?</a>

                <button type="submit" class="primary-button">Login</button>

                <p class="switch-text">
                    Don't have an account?
                    <a href="#" id="showSignup">Sign Up</a>
                </p>
            </form>
        </div>

        <div class="auth-card" id="signupBox" hidden>
            <div class="store-icon">
                <i class="fas fa-user-plus"></i>
            </div>

            <h1>Create Account</h1>
            <p class="subtitle">Join My Store today!</p>

            <form id="signupForm">
                <label for="newUsername">Username</label>
                <input type="text" id="newUsername" placeholder="Choose a username" autocomplete="username" required>

                <label for="newEmail">Email Address</label>
                <input type="email" id="newEmail" placeholder="Enter your email" autocomplete="email" required>

                <label for="newPassword">Password</label>
                <input type="password" id="newPassword" placeholder="Create a password" autocomplete="new-password" minlength="6" required>

                <button type="submit" class="primary-button">Create Account</button>

                <p class="switch-text">
                    Already have an account?
                    <a href="#" id="showLogin">Login</a>
                </p>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
